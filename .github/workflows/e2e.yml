# Browser tests (Playwright) on every pull request: the app runs as in production against freshly loaded fixtures
# (docker-compose.e2e.yml). The HTML report, traces and screenshots are kept as an artifact.
name: E2E

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  playwright:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - # v6.0.2
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

      - name: Docker Compose Setup
        # v0.0.1
        uses: ndeloof/install-compose-action@4a33bc31f327b8231c4f343f6fba704fedc0fa23
        with:
          version: v5.1.1
          legacy: false

      - name: Run the browser tests
        run: docker compose -p archery_e2e -f docker-compose.e2e.yml up --build --abort-on-container-exit --exit-code-from playwright
        env:
          CI: 'true'

      - name: Keep the report, traces and screenshots
        if: ${{ !cancelled() }}
        # v7.0.2
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: playwright-report
          path: |
            e2e/playwright-report/
            e2e/test-results/
          retention-days: 14
          if-no-files-found: ignore

      - name: Stop the stack
        if: ${{ always() }}
        run: docker compose -p archery_e2e -f docker-compose.e2e.yml down -v --remove-orphans
