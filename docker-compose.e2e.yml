# Browser tests (Playwright) against the app running as in production.
#   docker compose -p archery_e2e -f docker-compose.e2e.yml up --build --abort-on-container-exit --exit-code-from playwright
# The report, traces and screenshots land in e2e/playwright-report and e2e/test-results.
services:
  app:
    build:
      context: .
      dockerfile: docker/Dockerfile
      target: dev
    command: e2e
    environment:
      - APP_ENV=e2e
    networks:
      default:
        # Not "app": Chromium treats a bare "app" host as the .app top-level domain (HSTS preloaded) and forces HTTPS
        aliases: [archery-manager]
    depends_on:
      database:
        condition: service_healthy
      redis:
        condition: service_started
      mailpit:
        condition: service_started
    healthcheck:
      test: ["CMD", "curl", "-fsS", "-o", "/dev/null", "http://localhost/login"]
      interval: 5s
      timeout: 5s
      retries: 6
      # npm ci + asset build + fixtures before the first answer
      start_period: 600s

  database:
    image: mariadb:${MARIADB_VERSION:-12.1}
    environment:
      MARIADB_RANDOM_ROOT_PASSWORD: "yes"
      MARIADB_DATABASE: app_e2e
      MARIADB_USER: symfony
      MARIADB_PASSWORD: ChangeMe
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine

  mailpit:
    image: axllent/mailpit:v1.27.0

  playwright:
    image: mcr.microsoft.com/playwright:v1.64.1-noble
    working_dir: /e2e
    command: ["sh", "-c", "npm ci --no-audit --no-fund && npx playwright test"]
    environment:
      - BASE_URL=http://archery-manager
      - MAILPIT_URL=http://mailpit:8025
      - CI=${CI:-}
    volumes:
      - ./e2e:/e2e
    ipc: host
    depends_on:
      app:
        condition: service_healthy
