        gender: '@user_ladg_renew_2->gender'
        lastname: '@user_ladg_renew_2->lastname'
        firstname: '@user_ladg_renew_2->firstname'
        birthdate: '<dateTimeBetween("-75 years", "-22 years")>'
        fftaId: 8000002
        fftaMemberCode: '8000002B'
        groups:
            - '@group_ladg_competiteurs'
    licensee_ladg_renew_3:
        user: '@user_ladg_renew_3'
        gender: 'F'
        lastname: 'Bernard'
        firstname: 'Chloé'
        birthdate: '<dateTimeBetween("-16 years", "-13 years")>'
        fftaId: 8000003
        fftaMemberCode: '8000003C'

