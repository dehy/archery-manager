App\Entity\Licensee:
    licensee_ladg_coach_1:
        user: '@user_ladg_coach_1'
        gender: '@user_ladg_coach_1->gender'
        lastname: '@user_ladg_coach_1->lastname'
        firstname: '@user_ladg_coach_1->firstname'
        birthdate: '<dateTimeBetween("-75 years", "-22 years")>'
        fftaId (unique): '<fftaId()>'
        fftaMemberCode (unique): '<fftaCode($fftaId)>'
        groups:
            - '@group_ladg_competiteurs'
    licensee_ladg_club_admin_1:
        user: '@user_ladg_club_admin_1'
        gender: '@user_ladg_club_admin_1->gender'
        lastname: '@user_ladg_club_admin_1->lastname'
        firstname: '@user_ladg_club_admin_1->firstname'
        birthdate: '<dateTimeBetween("-75 years", "-10 years")>'
        fftaId (unique): '<fftaId()>'
        fftaMemberCode (unique): '<fftaCode($fftaId)>'
        groups:
            - '@group_ladg_competiteurs'
    licensee_ladg_{1..10}:
        user: '@user_ladg_<current()>'
        gender: '@user_ladg_<current()>->gender'
        lastname: '@user_ladg_<current()>->lastname'
        firstname: '@user_ladg_<current()>->firstname'
        birthdate: '<dateTimeBetween("-75 years", "-10 years")>'
        fftaId (unique): '<fftaId()>'
        fftaMemberCode (unique): '<fftaCode($fftaId)>'
        groups:
            - '@group_ladg_competiteurs'
    licensee_ladg_{11..20}:
        user: '@user_ladg_<($current-10)>'
        gender: '<enum("GenderType")>'
        lastname: '<lastname()>'
        firstname: '<firstname()>'
        birthdate: '<dateTimeBetween("-75 years", "-10 years")>'
        fftaId (unique): '<fftaId()>'
        fftaMemberCode (unique): '<fftaCode($fftaId)>'
    # Renewal candidates: only hold a 2026 (previous season) license, no 2027 license yet.
    # fftaMemberCode is fixed (not faker-generated) so the sample FFTA CSV import can reference it.
    licensee_ladg_renew_1:
        user: '@user_ladg_renew_1'
        gender: '@user_ladg_renew_1->gender'
        lastname: '@user_ladg_renew_1->lastname'
        firstname: '@user_ladg_renew_1->firstname'
        birthdate: '<dateTimeBetween("-75 years", "-22 years")>'
        fftaId: 8000001
        fftaMemberCode: '8000001A'
        groups:
            - '@group_ladg_competiteurs'
    licensee_ladg_renew_2:
